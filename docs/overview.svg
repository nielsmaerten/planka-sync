<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">planka-sync: local files and a Planka board, in sync both ways</title>
  <desc id="desc">AI coding agents such as Claude and Codex read and edit a local directory. A human reads and edits a Planka kanban board. Running npx planka-sync pushes local edits to Planka and pulls board changes to disk.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3f7fc"/><stop offset="1" stop-color="#eaf3f2"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#256b73" stroke-width="2" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: DejaVu Sans, Arial, sans-serif; fill: #172b43; }
      .muted { fill: #4d637a; }
      .mono { font-family: DejaVu Sans Mono, monospace; }
      .small { font-size: 16px; }
      .label { font-size: 20px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <text x="52" y="62" font-size="18" font-weight="700" letter-spacing="3" fill="#256b73">PLANKA-SYNC</text>
  <text x="52" y="107" font-size="34" font-weight="700">Your agents use files. You use Planka.</text>

  <rect x="52" y="184" width="350" height="280" rx="16" fill="#fff" stroke="#c4d3e3"/>
  <path d="M76 215h17l7 7h20v23H76Z" fill="#dceafa" stroke="#4477a8" stroke-width="2" stroke-linejoin="round"/>
  <text x="136" y="239" class="label">Local directory</text>
  <path d="M52 263h350" stroke="#dce5ef"/>
  <path d="M92 307v13h19m20 15v20h10m10 17v48m0-27h10m-10 27h10" stroke="#bfd0df" stroke-width="2" fill="none"/>
  <text x="76" y="300" class="mono small">project/</text>
  <text x="121" y="326" class="mono small">board/010-to-do/</text>
  <text x="141" y="361" class="mono small">010-add-search/</text>
  <text x="171" y="396" class="mono small">card.yaml</text>
  <text x="171" y="431" class="mono small">description.md</text>

  <text x="600" y="278" text-anchor="middle" font-size="25" font-weight="700">planka-sync</text>
  <text x="600" y="317" text-anchor="middle" class="small muted">Local edits to Planka</text>
  <path d="M428 339h341" fill="none" stroke="#256b73" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M772 379H431" fill="none" stroke="#256b73" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="412" text-anchor="middle" class="small muted">Board changes to disk</text>

  <rect x="798" y="184" width="350" height="280" rx="16" fill="#fff" stroke="#c4d3e3"/>
  <rect x="822" y="215" width="34" height="29" rx="5" fill="#d7eeea" stroke="#256b73" stroke-width="2"/>
  <path d="M831 223v13m8-13v13m8-13v13" stroke="#256b73" stroke-width="3"/>
  <text x="872" y="239" class="label">Planka board</text>
  <path d="M798 263h350" stroke="#dce5ef"/>
  <rect x="816" y="281" width="98" height="164" rx="8" fill="#f0f4f9"/>
  <rect x="924" y="281" width="98" height="164" rx="8" fill="#f0f4f9"/>
  <rect x="1032" y="281" width="98" height="164" rx="8" fill="#eaf5f1"/>
  <g font-size="14" font-weight="700"><text x="826" y="307">To do</text><text x="934" y="307">Doing</text><text x="1042" y="307">Done</text></g>
  <g fill="#fff" stroke="#d0dce7"><rect x="824" y="320" width="82" height="57" rx="6"/><rect x="932" y="320" width="82" height="57" rx="6"/><rect x="1040" y="320" width="82" height="57" rx="6"/><rect x="824" y="386" width="82" height="43" rx="6"/></g>
  <g stroke="#6c8399" stroke-width="3" stroke-linecap="round"><path d="M834 337h48m-48 11h34m92-11h48m-48 11h27M834 402h48m-48 11h27"/></g>
  <path d="m1067 347 7 7 15-17" fill="none" stroke="#297964" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M227 468v23" stroke="#839bb0" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M973 468v23" stroke="#839bb0" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="52" y="493" width="350" height="65" rx="13" fill="#e0eaf7"/>
